<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📚 BOOKISH BD</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* আপনার অরিজিনাল ডিজাইনের CSS */
:root{--navy:#1a2744;--blue:#2563eb;--blue-l:#dbeafe;--green:#16a34a;--green-l:#dcfce7;--red:#dc2626;--red-l:#fee2e2;--amber:#d97706;--amber-l:#fef3c7;--purple:#7c3aed;--purple-l:#ede9fe;--gray:#f8fafc;--gray2:#f1f5f9;--gray3:#e2e8f0;--gray4:#94a3b8;--text:#0f172a;--text2:#475569;--white:#fff;--r:12px;--sh:0 2px 12px rgba(0,0,0,0.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hind Siliguri',sans-serif;background:var(--gray);color:var(--text);line-height:1.6;padding-bottom:80px}
.header{background:var(--white);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--gray3);position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.logo{font-size:20px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px}
.logo span{color:var(--blue)}
.tabs-container{background:var(--white);padding:10px 0;border-bottom:1px solid var(--gray3);position:sticky;top:61px;z-index:90}
.tabs{display:flex;overflow-x:auto;padding:0 15px;gap:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 18px;background:var(--gray2);border-radius:20px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;transition:0.2s}
.tab.active{background:var(--navy);color:var(--white)}
.container{padding:15px}
.card{background:var(--white);border-radius:var(--r);padding:15px;margin-bottom:15px;box-shadow:var(--sh);border:1px solid var(--gray3)}
.f-group{margin-bottom:12px}
.f-label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--text2)}
.f-input{width:100%;padding:10px 12px;border:1.5px solid var(--gray3);border-radius:8px;font-size:15px;font-family:inherit;outline:none;transition:0.2s}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;background:var(--blue);color:var(--white)}
.loader-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.9);z-index:1000;display:none;flex-direction:column;justify-content:center;align-items:center}
.loader{width:40px;height:40px;border:4px solid var(--gray3);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">📚 <span>BOOKISH</span> BD</div>
  <div id="tdate" style="font-size:12px;font-weight:600;color:var(--gray4)"></div>
</div>

<div class="tabs-container">
  <div class="tabs">
    <div class="tab active" onclick="showSection('orders')">অর্ডার লিস্ট</div>
    <div class="tab" onclick="showSection('add')">নতুন অর্ডার</div>
    <div class="tab" onclick="showSection('stock')">স্টক</div>
  </div>
</div>

<div class="container" id="main"></div>

<div class="loader-bg" id="loader">
  <div class="loader"></div>
  <p style="margin-top:10px;font-weight:600" id="lmsg">লোড হচ্ছে...</p>
</div>

<script>
// ১. আপনার নতুন Google Script API লিঙ্ক
const API = 'https://script.google.com/macros/s/AKfycbzFyNH1wtWOq2hLPLXu5-x_VSKUtmVeEjiaPNa-7tyjbw0TlmlEz6UjahCOg7ihUYE21A/exec';

let orders = [], stock = [];

// ২. ডাটা আনা এবং পাঠানোর জন্য আপনার Code.gs এর সাথে সামঞ্জস্যপূর্ণ ফাংশন
async function callAPI(sheet, action = 'get', data = null, id = null) {
    let url = `${API}?sheet=${sheet}&action=${action}`;
    if (id) url += `&id=${id}`;
    
    // আপনার স্ক্রিপ্ট বডি প্যারামিটার হিসেবে এনকোডেড ডাটা নেয়
    if (data) {
        const body = { action: action === 'create' ? 'post' : 'patch', data: data };
        url += `&body=${encodeURIComponent(JSON.stringify(body))}`;
    }

    try {
        const res = await fetch(url);
        return await res.json();
    } catch (e) {
        console.error("Error:", e);
        return { error: true };
    }
}

// ৩. সেকশন পরিবর্তন
function showSection(p) {
    document.querySelectorAll('.tab').forEach(t => {
        t.classList.remove('active');
        if(t.textContent.includes(p === 'orders' ? 'অর্ডার লিস্ট' : p === 'add' ? 'নতুন অর্ডার' : 'স্টক')) t.classList.add('active');
    });
    
    if(p === 'orders') loadOrders();
    else if(p === 'add') renderForm();
    else if(p === 'stock') loadStock();
}

async function loadOrders() {
    showL(true, 'অর্ডার লোড হচ্ছে...');
    const data = await callAPI('orders');
    if(!data.error) {
        orders = data;
        renderOrders();
    }
    showL(false);
}

async function saveOrder() {
    const btn = document.querySelector('.btn');
    btn.disabled = true;
    
    const newOrder = {
        id: "ID-" + Date.now(), // এটি ডিলিট বা এডিটের জন্য জরুরি
        Date: new Date().toLocaleDateString('en-GB'),
        Status: "Pending",
        Name: document.getElementById('oname').value,
        Phone: document.getElementById('ophone').value,
        Book: document.getElementById('obook').value,
        Total: document.getElementById('ototal').value
    };

    showL(true, 'অর্ডার সেভ হচ্ছে...');
    const res = await callAPI('orders', 'create', newOrder);
    
    if(res.created) {
        alert('অর্ডার সফলভাবে সেভ হয়েছে!');
        showSection('orders');
    } else {
        alert('ভুল হয়েছে! শিটে id কলামটি চেক করুন।');
    }
    showL(false);
    btn.disabled = false;
}

// ৪. ডিলিট ফাংশন (আপনার Code.gs অনুযায়ী)
async function delOrder(id) {
    if(!confirm('মুছে ফেলতে চান?')) return;
    showL(true, 'মুছে ফেলা হচ্ছে...');
    const res = await callAPI('orders', 'delete', null, id);
    if(res.deleted) {
        loadOrders();
    } else {
        alert('মুছে ফেলা যায়নি।');
    }
    showL(false);
}

// ৫. UI রেন্ডারিং
function renderOrders() {
    const main = document.getElementById('main');
    if(orders.length === 0) { main.innerHTML = '<p>কোনো অর্ডার পাওয়া যায়নি।</p>'; return; }
    
    main.innerHTML = orders.map(o => `
        <div class="card">
            <div style="display:flex;justify-content:space-between">
                <strong>${o.Name || 'নাম নেই'}</strong>
                <span style="color:var(--blue);font-weight:700">${o.Status || 'Pending'}</span>
            </div>
            <p style="font-size:14px;color:var(--text2)">📞 ${o.Phone || '-'}</p>
            <p style="font-size:14px;color:var(--text2)">📖 ${o.Book || '-'}</p>
            <div style="margin-top:10px;text-align:right">
                <button onclick="delOrder('${o.id}')" style="color:var(--red);border:none;background:none;font-weight:600;cursor:pointer">ডিলিট</button>
            </div>
        </div>
    `).join('');
}

function renderForm() {
    document.getElementById('main').innerHTML = `
        <div class="card">
            <h3 style="margin-bottom:15px">নতুন অর্ডার এন্ট্রি</h3>
            <div class="f-group"><label class="f-label">নাম</label><input id="oname" class="f-input"></div>
            <div class="f-group"><label class="f-label">ফোন</label><input id="ophone" class="f-input"></div>
            <div class="f-group"><label class="f-label">বইয়ের নাম</label><input id="obook" class="f-input"></div>
            <div class="f-group"><label class="f-label">মোট টাকা</label><input id="ototal" type="number" class="f-input"></div>
            <button class="btn" onclick="saveOrder()">সেভ করুন</button>
        </div>
    `;
}

function showL(s, m) {
    document.getElementById('lmsg').textContent = m;
    document.getElementById('loader').style.display = s ? 'flex' : 'none';
}

window.onload = () => {
    document.getElementById('tdate').textContent = new Date().toLocaleDateString('bn-BD');
    loadOrders();
};
</script>
</body>
</html>
